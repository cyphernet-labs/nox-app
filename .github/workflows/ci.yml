name: NOX CI

# ⏸ TEMPORARILY DISABLED (2026-06-26): automatic runs are OFF to conserve scarce CI
# minutes during active development. While paused, the gate is MANDATORY LOCALLY before
# every commit/push — run `make gate` (generate → format → analyze → test) and
# `make golden-verify`. Re-enable by uncommenting the push/pull_request triggers below
# (and deleting the workflow_dispatch-only line). Manual runs stay available via the
# Actions tab (workflow_dispatch).
on:
  workflow_dispatch:
  # push:
  #   branches: [develop, master]
  #   paths: ['lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml', 'build.yaml']
  # pull_request:
  #   paths: ['lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml', 'build.yaml']

jobs:
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The Tor client (packages/nox_tor) is Rust, built by the native-assets hook.
      # Its toolchain is pinned in rust-toolchain.toml; the hook would fetch it on
      # its own, but installing it here keeps the build log readable and the
      # targets limited to what this job builds. `flutter test` runs the hook too:
      # the package's tests load the library built for the host.
      - name: Rust toolchain for the Tor client
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' packages/nox_tor/rust/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Format check (lib + test only; docs/ and generated excluded)
        run: dart format -l 140 --set-exit-if-changed $(git ls-files lib test | grep '\.dart$')
      - run: flutter analyze
      - run: flutter test --exclude-tags golden   # golden tests are local-only (M1/macOS), excluded from CI
