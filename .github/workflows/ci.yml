name: NOX CI

# ⏸ TEMPORARILY DISABLED (2026-06-26): automatic runs are OFF to conserve scarce CI
# minutes during active development. While paused, the gate is MANDATORY LOCALLY before
# every commit/push — run `make gate` (generate → format → analyze → test) and
# `make golden-verify`. Re-enable by uncommenting the push/pull_request triggers below
# (and deleting the workflow_dispatch-only line). Manual runs stay available via the
# Actions tab (workflow_dispatch).
on:
  workflow_dispatch:
  # push:
  #   branches: [develop, master]
  #   paths: ['lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml', 'build.yaml']
  # pull_request:
  #   paths: ['lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml', 'build.yaml']

jobs:
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Format check (lib + test only; docs/ and generated excluded)
        run: dart format -l 140 --set-exit-if-changed $(git ls-files lib test | grep '\.dart$')
      - run: flutter analyze
      - run: flutter test --exclude-tags golden   # golden tests are local-only (M1/macOS), excluded from CI
