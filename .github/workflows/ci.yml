name: NOX CI

on:
  push:
    branches: [develop, master]
    paths: ['lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml', 'build.yaml']
  pull_request:
    paths: ['lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml', 'build.yaml']

jobs:
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Format check (line length 140; generated excluded)
        run: dart format -l 140 --set-exit-if-changed $(git ls-files '*.dart' | grep -vE '\.(g|freezed|config)\.dart')
      - run: flutter analyze
      - run: flutter test
