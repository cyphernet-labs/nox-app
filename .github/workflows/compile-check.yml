name: NOX Compile check

# Five per-platform debug smoke builds (no secrets). Launch-verify today: macOS + iOS
# + Android; Windows/Linux are compile-only (launch is a tracked follow-up). Desktop
# flavor comes from config/<flavor>.json (no native --flavor). Packaging/signing: FUTURE.

# ⏸ TEMPORARILY DISABLED (2026-06-26): see ci.yml — auto-runs off to conserve CI
# minutes during active development. Manual only for now; re-enable by uncommenting
# the push trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches: [develop, master]
  #   paths: ['lib/**', 'pubspec.yaml', 'pubspec.lock']

jobs:
  compile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Tor client (packages/nox_tor) is Rust, built by the native-assets hook.
      # Its toolchain is pinned in rust-toolchain.toml; the hook would fetch it on
      # its own, but installing it here keeps the build log readable and the
      # targets limited to what this job builds.
      - name: Rust toolchain for the Tor client
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' packages/nox_tor/rust/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # The hook links the Tor client with the NDK's clang, before Gradle runs,
      # so the NDK Flutter 3.44.1 pins has to be there already.
      - name: Android NDK for the Tor client
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.1', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug --dart-define-from-file=config/stage.json

  compile-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The Tor client (packages/nox_tor) is Rust, built by the native-assets hook.
      # Its toolchain is pinned in rust-toolchain.toml; the hook would fetch it on
      # its own, but installing it here keeps the build log readable and the
      # targets limited to what this job builds.
      - name: Rust toolchain for the Tor client
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' packages/nox_tor/rust/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.1', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --debug --no-codesign --dart-define-from-file=config/stage.json

  compile-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The Tor client (packages/nox_tor) is Rust, built by the native-assets hook.
      # Its toolchain is pinned in rust-toolchain.toml; the hook would fetch it on
      # its own, but installing it here keeps the build log readable and the
      # targets limited to what this job builds.
      - name: Rust toolchain for the Tor client
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' packages/nox_tor/rust/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.1', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --debug --dart-define-from-file=config/stage.json

  compile-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The Tor client (packages/nox_tor) is Rust, built by the native-assets hook.
      # Its toolchain is pinned in rust-toolchain.toml; the hook would fetch it on
      # its own, but installing it here keeps the build log readable and the
      # targets limited to what this job builds.
      - name: Rust toolchain for the Tor client
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' packages/nox_tor/rust/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.1', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --debug --dart-define-from-file=config/stage.json

  # No Rust here: the Tor client is not built for Linux yet (stage tor-linux-app),
  # and its hook returns without touching cargo.
  compile-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.1', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --debug --dart-define-from-file=config/stage.json
