# Flutter gen-l10n config. ARB source of truth lives in lib/l10n/; the generated
# AppLocalizations lands next to it and is gitignored (regenerated on pub get /
# `fvm flutter gen-l10n`, like the other codegen). UI languages: English + Ukrainian.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
