# Dart/Flutter test-runner config.
#
# The `golden` tag marks macOS/M1-rendered snapshot tests (`@Tags(['golden'])`). They are
# generated and verified ONLY locally — `make golden-update` / `make golden-verify` (which pass
# `--tags golden`) — and are EXCLUDED from `make test` and CI (`flutter test --exclude-tags golden`).
# Declaring the tag here silences "unknown tag" warnings; see .claude/commands/golden-test.md.
# The `live` tag marks probes that need a running `noxd`. They are run by hand
# against a real server and excluded from the gate, because the gate must not
# depend on a process nobody started. Benches that measure rather than check
# (phase 048, SC-003) carry it too: a loaded machine would make them flaky.
tags:
  golden:
  live:
