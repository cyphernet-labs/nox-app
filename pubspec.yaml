name: nox_app
description: "NOX secure messenger."
publish_to: 'none'

# CalVer + shifted-epoch build (YY.M.D+EPOCH; см. docs/blueprints/mobile/09-build-and-secrets-infra.md §9).
version: 26.1.1+0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: 3.44.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # --- State management ---
  flutter_bloc: 9.1.1
  bloc_concurrency: 0.3.0

  # --- Core model / reactive ---
  freezed_annotation: 3.1.0
  json_annotation: ^4.12.0
  rxdart: 0.28.0
  collection: 1.19.1
  intl: 0.20.2
  uuid: ^4.5.3

  # --- DI ---
  injectable: ^3.0.0
  get_it: ^9.2.1

  # --- Network ---
  dio: ^5.9.2

  # --- Pagination / UI list ---
  infinite_scroll_pagination: 5.1.1
  skeletonizer: ^2.1.3
  flutter_screenutil: 5.9.3
  cached_network_image: 3.4.1
  flutter_svg: ^2.3.0
  url_launcher: 6.3.2

  # --- Links ---
  app_links: ^7.1.1

  # --- Local store ---
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1   # desktop: macOS Keychain / Windows DPAPI / Linux libsecret
  sembast: ^3.8.8
  path_provider: 2.1.5

  # --- Misc ---
  logger: ^2.7.0
  package_info_plus: ^10.1.0
  material_symbols_icons: ^4.2928.1

  # --- Feature-gated (mobile-only / activated with the corresponding blueprint doc) ---
  # firebase_core / firebase_messaging — push (mobile-only; desktop = disabled no-op)
  # permission_handler, file_picker, image_picker, connectivity_plus, mixpanel_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: 6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  injectable_generator: ^3.0.2
  flutter_gen_runner: ^5.14.1
  mockito: ^5.6.4   # 5.6.5+ needs analyzer ^13 which conflicts with injectable_generator (analyzer <13)
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/png/
    - assets/svg/
    - assets/animation/
  # Sans — platform-native (not bundled); bundle only mono (Roboto Mono, OFL) for the Your ID slot.
  fonts:
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf

flutter_gen:
  output: lib/design/gen/
  line_length: 140
  integrations:
    flutter_svg: true
    lottie: false
  assets:
    enabled: true
    outputs:
      style: dot-delimiter
      package_parameter_enabled: false
  fonts:
    enabled: false
  colors:
    enabled: false
