name: nox_app
description: "NOX secure messenger."
publish_to: 'none'

# CalVer + shifted-epoch build (YY.M.D+EPOCH; см. docs/blueprints/mobile/09-build-and-secrets-infra.md §9).
version: 26.1.1+0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: 3.44.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # --- State management ---
  flutter_bloc: 9.1.1
  bloc_concurrency: 0.3.0

  # --- Core model / reactive ---
  freezed_annotation: 3.1.0
  json_annotation: ^4.12.0
  rxdart: 0.28.0
  collection: 1.19.1
  intl: 0.20.2
  uuid: ^4.5.3

  # --- DI ---
  injectable: ^3.0.0
  get_it: ^9.2.1

  # --- Network ---
  dio: ^5.9.2

  # --- Pagination / UI list ---
  infinite_scroll_pagination: 5.1.1
  skeletonizer: ^2.1.3
  flutter_screenutil: 5.9.3
  cached_network_image: 3.4.1
  flutter_svg: ^2.3.0
  url_launcher: 6.3.2

  # --- Links ---
  app_links: ^7.1.1

  # --- Local store ---
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1   # desktop: macOS Keychain / Windows DPAPI / Linux libsecret
  sembast: ^3.8.8
  path_provider: 2.1.5

  # --- Misc ---
  logger: ^2.7.0
  package_info_plus: ^10.1.0

  # --- Camera / QR (010-qr-login) ---
  mobile_scanner: ^7.2.0        # camera QR scan; iOS/Android/macOS only, NO Windows/Linux (capability-gated, build-safe)
  permission_handler: ^12.0.3   # camera permission status/request/openAppSettings; iOS/Android only (macOS unsupported)
  qr_flutter: ^4.1.0            # pure-Dart QR render (Show QR); all 5 platforms, no native plugin
  file_selector: ^1.1.0

  # --- Feature-gated (mobile-only / activated with the corresponding blueprint doc) ---
  # firebase_core / firebase_messaging — push (mobile-only; desktop = disabled no-op)
  # file_picker, image_picker, connectivity_plus, mixpanel_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: 6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  injectable_generator: ^3.0.2
  flutter_gen_runner: ^5.14.1
  mockito: ^5.6.4   # 5.6.5+ needs analyzer ^13 which conflicts with injectable_generator (analyzer <13)
  bloc_test: ^10.0.0

  # Launcher-icon regeneration (NOT run in 008-app-icons — current install is a drop-in of the
  # hand-crafted set in docs/design/system/nox-app-icons/; see contracts/flutter-launcher-icons.md).
  # Kept as the reproducible regen path for the final vector logo (then switch bg to brand #0C2424).
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/png/
    - assets/svg/icons/
    - assets/svg/illustrations/
    - assets/svg/flags/
    - assets/animation/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400

# Launcher-icon regeneration config — DO NOT run the generator in 008-app-icons (it would overwrite
# the hand-crafted per-platform set and does not cover Linux). Reproducible path for the future vector.
flutter_launcher_icons:
  image_path: "docs/design/system/nox-app-icons/source/icon-master-1024.png"
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  adaptive_icon_background: "#151919"   # temporary (raster backdrop); switch to brand #0C2424 with the vector
  adaptive_icon_foreground: "docs/design/system/nox-app-icons/source/icon-foreground-1024.png"
  remove_alpha_ios: true

flutter_gen:
  output: lib/design/gen/
  line_length: 140
  integrations:
    flutter_svg: true
    lottie: false
  assets:
    enabled: true
    outputs:
      style: dot-delimiter
      package_parameter_enabled: false
  fonts:
    enabled: false
  colors:
    enabled: false
