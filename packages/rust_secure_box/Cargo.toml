[package]
name = "rust_secure_box"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "RustSecureBox: the keys and signatures of the NOX connection check, one library for the app and the server. A stub for now."

# rlib only. The app links this crate into its Rust module (packages/nox_tor),
# and the server's WebAssembly copy is built by build-wasm.sh with
# `cargo rustc --crate-type cdylib`: a cdylib here would be built, for nothing,
# for every platform the app targets.
[lib]
crate-type = ["rlib"]

[dependencies]
# The stub's hash. A real RustSecureBox brings what it needs instead.
sha2 = { version = "0.10", default-features = false }
zeroize = "1"

# Where random bytes come from in the app: the system. In WebAssembly they come
# from the host instead (src/random.rs), so getrandom is not built there at all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

[dev-dependencies]
serde_json = "1"

# Applies to the WebAssembly build only (build-wasm.sh runs cargo in this
# directory). Built as a dependency of nox_tor, the crate takes nox_tor's
# profile. wasm32-unknown-unknown aborts on panic anyway: an abort is a trap the
# server's Go wrapper turns into an error.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
