[package]
name = "nox_tor"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "The NOX app's channel to its server (TLS 1.3 and Eidolon) and its embedded Tor client, behind a C ABI."

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Pinned exactly: experimental-api and hs-pow-full carry no semver promise, and
# a new Arti is a decision of its own, checked against an onion service's
# proof of work again (045).
arti-client = { version = "=0.47.0", default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "static-sqlite",
    "compression",
    # Not for keys - since 045 the client holds none - but for the switch that
    # turns the keystore off (engine::client_config). tor-chanmgr brings the
    # key manager in regardless, and without this feature Arti keeps a keystore
    # under the state directory with no way to say otherwise.
    "keymgr",
    # HsId, the onion address parsed: what the hedge's group is kept by.
    "experimental-api",
    # Solves the puzzle (Equi-X) an onion service with its defenses on sets:
    # under load it takes the clients that solved one first. Without this
    # tor-hsclient builds a stub that never offers a solution.
    "hs-pow-full",
] }
tor-rtcompat = "=0.47.0"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# The channel's TLS. ring only, like the rustls above: the default would bring
# aws-lc-rs, and with it a C library on every platform.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Eidolon, the check of both keys over the TLS channel binding (044). Pinned
# exactly: the shared vectors in specs/044-secure-channel/contracts are what
# these versions produce, byte for byte, and the Go server reproduces them.
eidolon-auth = "=0.3.1"
cyphergraphy = { version = "=0.3.1", features = ["ed25519"] }
ec25519 = { version = "=0.1.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
sha3 = "0.10"
data-encoding = "2"
# Already in the graph through Arti; named here for the device seed and the
# key made from it.
zeroize = "1"
# The vault (048): ChaCha20-Poly1305 and HKDF-SHA256 over what the app keeps on
# the device's disk. Already in the graph under rustls, with the same features;
# named here because the vault calls it itself.
ring = "0.17"

[dev-dependencies]
# Paused time for the tests of the hedged connect. Tests only: a release build
# never sees the feature.
tokio = { version = "1", features = ["test-util"] }
# Throwaway certificates for the TLS servers the channel tests stand up, the
# way the real server makes one at every start. ring and nothing more: no PEM
# is read, and aws_lc_rs would bring a C library into the tests.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# unwind, not abort: tokio keeps a panicking Arti task from taking the whole app
# down, and the C ABI turns a panic into an error code instead of a crash.
panic = "unwind"
