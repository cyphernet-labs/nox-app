[toolchain]
# arti-client 0.47 needs Rust 1.92 or newer. Pinned like Flutter is through FVM,
# so every machine and CI job builds the same Tor client.
channel = "1.93.1"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
