</script>
<script type="module">
  import { marked } from 'https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js';
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  const md = document.getElementById('src').textContent;
  document.getElementById('content').innerHTML = marked.parse(md);
  // marked emits ```mermaid as <pre><code class="language-mermaid">; convert to <div class="mermaid"> for mermaid.run.
  document.querySelectorAll('code.language-mermaid').forEach((el) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = el.textContent;
    (el.closest('pre') || el).replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: false, theme: 'default' });
  // Render one at a time with an explicit id. mermaid.run() derives the SVG id from a timestamp, so
  // diagrams finishing in the same millisecond collide — and Chrome silently paints nothing for the
  // duplicates when printing, leaving blank gaps in the PDF. Do not swap this back for mermaid.run().
  const blocks = Array.from(document.querySelectorAll('.mermaid'));
  for (let i = 0; i < blocks.length; i++) {
    const { svg } = await mermaid.render('nox-diagram-' + i, blocks[i].textContent);
    blocks[i].innerHTML = svg;
  }
  document.title = 'render-complete';
</script>
</body>
</html>
