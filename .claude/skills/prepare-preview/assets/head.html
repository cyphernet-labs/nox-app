<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { --g:#2e7d32; --y:#b58900; --r:#c62828; }
  body { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, "Apple Color Emoji", sans-serif;
         max-width: 900px; margin: 0 auto; padding: 20px 28px; color:#1a1a1a; line-height:1.5; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; border-bottom:1px solid #e5e5e5; padding-bottom:4px; margin-top:26px; }
  h3 { font-size: 15.5px; color:#1a1a1a; margin-top: 20px; margin-bottom: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 8px 0; }
  th,td { border:1px solid #e0e0e0; padding:5px 9px; text-align:left; vertical-align:top; }
  th { background:#f6f6f6; }
  code { background:#f2f2f2; padding:1px 5px; border-radius:3px; font-size:12px; }
  pre { background:#f7f7f7; padding:10px 12px; border-radius:6px; overflow-x:auto; }
  pre code { background:none; padding:0; }
  blockquote { border-left:4px solid var(--y); background:#fff9e6; padding:8px 14px; margin:12px 0; border-radius:0 4px 4px 0; }
  /* Chrome drops an SVG that straddles a print page break — it reserves the space and paints nothing.
     Keeping each diagram on one page is the fix; do not remove. */
  .mermaid { text-align:center; margin:14px 0; break-inside: avoid; page-break-inside: avoid; }
  .mermaid svg { max-width:100%; height:auto; }
  table, pre, blockquote { break-inside: avoid; }
  h1,h2,h3 { break-after: avoid; }
  hr { border:none; border-top:1px solid #e5e5e5; margin:20px 0; }
  a { color:#1565c0; }
  @page { size: A4; margin: 14mm; }
</style>
</head>
<body>
<div id="content"></div>
<script type="text/markdown" id="src">
